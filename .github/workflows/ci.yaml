name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Intel scope tests
        run: ./scripts/test-intel-scope.sh -count=1

      # Agent commands are behind -tags agent (off by default for release). Re-enable when shipping GateAI discovery:
      # - name: Agent discovery validate
      #   run: |
      #     go test -tags agent ./internal/agentcmd -run TestAgentValidate -count=1
      #     go build -tags agent -o gate-cli .
      #     ./gate-cli agent-validate --format json
